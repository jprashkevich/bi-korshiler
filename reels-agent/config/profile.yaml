# ============================================================
#  ПРОФИЛЬ — материал, который агент использует для хуков,
#  описаний и текстов бота. Заполняется один раз в диалоге
#  с агентом (/reels-setup) и правится по мере надобности.
#  Всё, что в <угловых скобках>, нужно заменить.
# ============================================================

account:
  handle: "<@ваш_аккаунт>"
  lang: ru                 # основной язык роликов: ru | en | kk | uz
  second_lang: en          # второй аккаунт/язык, если есть (иначе удалите)
  tone: "на «ты», тёплый, без воды, с самоиронией"   # как вы говорите с аудиторией
  forbidden: []            # слова и темы, которых не должно быть в текстах

# --- Кому помогаете и с чем они приходят ------------------------------
audience:
  who: "<например: эксперты и предприниматели, которые ведут Instagram сами>"
  level: "<новички / практики / продвинутые>"
  pains:                   # 5–10 болей их словами, без приукрашивания
    - "<выкладываю, а просмотров 100–200>"
    - "<не знаю, что снимать, стесняюсь камеры>"
  desires:                 # что хотят получить на самом деле
    - "<стабильные заявки из Instagram без съёмок каждый день>"
  faq:                     # вопросы, которые вам задают снова и снова (минимум 5)
    - "<с чего начать, если аккаунт мёртвый?>"
    - "<нужно ли показывать лицо?>"
  objections:              # почему не покупают / не делают
    - "<это работает только у тех, у кого уже есть аудитория>"
  myths:                   # что люди считают правдой, а это не так
    - "<нужно снимать каждый день>"

# --- Экспертность: факты и тезисы, которые можно использовать в текстах ---
expertise:
  bio_short: "<кто вы в одной строке>"
  proof:                   # только проверяемые факты, без выдуманных цифр
    - "<N лет в теме / N клиентов / конкретный результат, который можно подтвердить>"
  core_ideas:              # 5–10 ваших ключевых мыслей, с которыми вы согласны на 100%
    - "<заголовок решает 90% судьбы ролика>"
    - "<показывать нужно мысль, а не себя>"
  frameworks:              # ваши методики, шаги, чеклисты (агент разложит их на серии хуков)
    - name: "<название>"
      steps:
        - "<шаг 1>"
        - "<шаг 2>"
  stories:                 # короткие истории/кейсы: что было → что сделали → что стало
    - "<4 ролика по 100 просмотров → разобрала чужие хуки → 700к за день>"

# --- Что продаёте и куда ведём после ролика ---------------------------
offer:
  main:
    name: "<продукт/услуга>"
    price: "<цена или диапазон>"
    for_whom: "<для кого>"
    result: "<какой результат обещаете честно>"
    link: "<ссылка>"
  lead_magnets:            # бесплатные материалы, которые отдаёт бот по кодовому слову
    - keyword: "ГАЙД"      # кодовое слово — ЗАГЛАВНЫМИ, одно слово, без пробелов
      title: "<название материала>"
      what_inside: "<что внутри, 1–2 строки>"
      link: "<ссылка на файл/страницу>"
      next_step: "<куда ведёт после: консультация / продукт / канал>"
  funnel:                  # путь человека: ролик → ... → покупка
    - "рилс → комментарий с кодовым словом"
    - "бот присылает материал в директ"
    - "через 1 день — вопрос «получилось ли применить?» + приглашение на <следующий шаг>"

# --- Стиль видео (выбирается в /reels-setup, можно менять по партиям) ----
style:
  preset: classic          # classic | clean | editorial | caps | mono | notes
  position: center         # top | center | bottom
  animation: fade          # none | fade | pop | typewriter | lines
  darken: 0.25             # затемнение видео под текстом 0–0.7
  accent: null             # свой акцентный цвет, напр. "#FFD60A"; null = из пресета
  use_endcard: true        # финальная карточка с призывом в конце ролика
  duration: 8              # секунд

# --- Хэштеги по умолчанию (3–5, нишевые, без #reels #viral) ---------------
hashtags:
  - "<#ниша>"
  - "<#подниша>"
  - "<#аудитория>"
