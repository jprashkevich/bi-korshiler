# Справочник пресетов оформления (реализованы в remotion/src/presets.ts).
# Агент показывает этот список при настройке и подставляет выбор в config/profile.yaml.

presets:
  classic:
    name: "Классика рилсов"
    font: "Montserrat ExtraBold"
    look: "белый жирный текст с мягкой тенью и тонкой обводкой, акцент — жёлтый"
    best_for: "любая ниша, самый узнаваемый «инстаграмный» стиль"
  clean:
    name: "Чистый"
    font: "Inter SemiBold"
    look: "белый текст без обводки, мягкий градиент сверху/снизу, акцент — голубой"
    best_for: "эксперты, психология, бизнес, минимализм"
  editorial:
    name: "Журнальный"
    font: "Playfair Display Italic"
    look: "курсивная антиква, премиальное ощущение, акцент — золотистый"
    best_for: "лайфстайл, бьюти, коучинг, «дорогие» ниши"
  caps:
    name: "Капс"
    font: "Oswald SemiBold, заглавные"
    look: "плотный капс с жёсткой тенью, акцент — красный; читается с любого расстояния"
    best_for: "фитнес, деньги, мотивация, жёсткие тезисы"
  mono:
    name: "Моно / терминал"
    font: "PT Mono"
    look: "моноширинный текст, печатная машинка, акцент — зелёный"
    best_for: "IT, аналитика, «честные» ниши, антиглянец"
  notes:
    name: "Заметки"
    font: "Inter Medium на белой карточке"
    look: "как скриншот из «Заметок» iPhone, тёмный текст на белом"
    best_for: "личные истории, признания, списки, «из дневника»"

positions:
  top: "верхняя треть — хорошо, когда в кадре внизу есть действие"
  center: "по центру — максимальная читаемость, стандарт"
  bottom: "нижняя треть над описанием — когда сверху важный план"

animations:
  none: "без анимации, текст сразу в кадре"
  fade: "мягкое появление (по умолчанию)"
  pop: "пружинистое увеличение — энергичные хуки"
  typewriter: "печатная машинка — для mono и notes"
  lines: "строки появляются по очереди — для списков и 2–3-строчных хуков"

# Правила вёрстки хука (агент соблюдает их при составлении batch.json):
rules:
  max_words: 12
  max_lines: 4
  max_chars_per_line: 22       # чтобы кегль оставался крупным
  manual_breaks: true          # переносы ставит агент через \n по смыслу, а не браузер
  accent: "одно–два слова через *звёздочки*, только то, на чём держится смысл"
  subtext: "не обязателен; максимум 6 слов"
