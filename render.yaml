# Render Blueprint для контент-завода BIG Life (код в папке content-factory/).
# Один фоновый воркер: Telegram-бот + ежедневная подготовка постов. Плюс база Postgres.
services:
  - type: worker
    name: biglife-content-factory
    runtime: docker
    plan: standard            # 2 ГБ памяти: нужен для Chromium (рендер слайдов)
    dockerfilePath: ./content-factory/Dockerfile
    dockerContext: .
    buildFilter:
      paths:
        - content-factory/**
        - images/**
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: biglife-factory-db
          property: connectionString
      - key: FACTORY_TZ
        value: Asia/Almaty
      - key: DAILY_RUN_HOUR
        value: "6"
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: TELEGRAM_APPROVER_IDS
        sync: false
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: ELEVENLABS_VOICE_ID
        sync: false
      - key: PIXABAY_API_KEY
        sync: false
      - key: THREADS_APP_ID
        sync: false
      - key: THREADS_APP_SECRET
        sync: false
      - key: THREADS_REDIRECT_URI
        value: https://localhost/
      - key: GOOGLE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: GOOGLE_SHEET_ID
        sync: false
      - key: GOOGLE_DRIVE_FOLDER_ID
        value: 1QTob9XH2ZcJTSFE8auFQvxIg6zmUxfKK
      - key: INSTAGRAM_ACCESS_TOKEN     # токен системного пользователя Meta Business (EAA…) или Instagram Login (IG…)
        sync: false
      - key: INSTAGRAM_USER_ID          # id Instagram-аккаунта BIG Life (для токена IG… можно не задавать)
        sync: false
      - key: MEDIA_BASE_URL
        value: https://biglife-media.onrender.com

  # Публичная раздача слайдов и видео для Instagram: он скачивает файлы сам по адресу,
  # а воркер из интернета не виден. Бесплатный план: засыпает, воркер будит его перед публикацией.
  - type: web
    name: biglife-media
    runtime: python
    plan: free
    rootDir: content-factory
    buildCommand: pip install "psycopg[binary]>=3.2,<4"
    startCommand: python media_server.py
    healthCheckPath: /health
    buildFilter:
      paths:
        - content-factory/media_server.py
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: biglife-factory-db
          property: connectionString

databases:
  - name: biglife-factory-db
    plan: basic-256mb
