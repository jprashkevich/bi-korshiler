# Город мероприятия для рубрики «Жизнь дворов».
# Порядок: /city в боте → complexes ниже → справочник ЖК config/complex_cities.json (618 ЖК из списка владельца)
# → слово-подсказка в названии ЖК → группа отчётов (запасной вариант, если ЖК нет в справочнике).
# «Управление Астана 2» ведёт ЖК в Астане, Атырау, Актау и Караганде, поэтому группа 2 и «Запад» город не задают.

groups:                       # группа WhatsApp/Telegram из report.json → город
  "Community 1 Управление": Астана
  "Community 3 Управление": Астана
  "Community 4 Управление": Астана
  "Community Алматы": Алматы
  "Community Шымкент": Шымкент
  "NRG Event Life": Ташкент

keywords:                     # слово в названии ЖК → город (без учёта регистра)
  shymkent: Шымкент
  шымкент: Шымкент
  karaganda: Караганда
  караганд: Караганда
  tashkent: Ташкент
  ташкент: Ташкент
  almaty: Алматы
  алматы: Алматы
  astana: Астана
  атырау: Атырау
  atyrau: Атырау
  актау: Актау
  aktau: Актау
  актобе: Актобе
  aktobe: Актобе

complexes: {}                 # «Название ЖК»: Город — постоянные исключения
