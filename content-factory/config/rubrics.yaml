# Рубрикатор и недельная сетка: 2 публикации в день, 14 в неделю.
# source: rss — тема берётся из RSS по скорингу; brand — пост о продукте без внешнего источника.
# fallback: рубрика, которой заменить эту, если для неё нет материала (например, отчёты из Drive ещё не подключены).

rubrics:
  science:
    title: Наука о соседстве
    source: rss
    format: carousel
    slides: 6
    brief: >
      Разбор одного свежего исследования о социальных связях, соседстве, одиночестве, сообществах,
      социальном здоровье или долголетии. Хук на обложке, суть исследования, главный вывод,
      что это значит для жизни во дворе, маленький практический шаг, призыв сохранить/отправить соседу.
  practice:
    title: Долголетие на практике
    source: rss
    prefer_kind: popular
    format: carousel
    slides: 6
    brief: >
      Практическая инструкция: конкретные шаги или привычки для активного долголетия,
      которые легче делать вместе с соседями. Опора на источник, акцент на «что сделать на этой неделе».
  number:
    title: Цифра дня
    source: rss
    format: reels           # если ElevenLabs не подключён — карусель из 4 слайдов
    slides: 4
    brief: >
      Одна сильная цифра из исследования крупно на слайде, затем контекст (кто, где, сколько людей),
      что из этого следует для нас и вопрос аудитории. Только если в источнике есть настоящая цифра.
  courtyard:
    title: Жизнь дворов
    source: drive           # этап 2: отчёты о соседских активностях из Google Drive
    fallback: science
    format: carousel
    slides: 6
    brief: Подборка или обзор по отчётам о проведённых соседских активностях BIG Life, с реальными фото.
  question:
    title: Вопрос недели
    source: rss
    format: carousel
    slides: 4
    brief: >
      Интерактив: факт из исследования и простой вопрос к аудитории, на который хочется ответить
      в комментариях (опыт, мнение, выбор из вариантов).
  app:
    title: BIG App
    source: brand
    format: carousel
    slides: 5
    brief: >
      Польза BIG App для жителей: лента активностей двора, календарь «Картина дня», чаты соседей,
      роль «Драйвера дома». Через жизненную ситуацию, без рекламного тона.

# Недельная сетка (1 = понедельник). Два слота в день: утро и вечер.
schedule:
  1: [science, practice]
  2: [science, number]
  3: [science, courtyard]
  4: [science, practice]
  5: [science, number]
  6: [courtyard, question]
  7: [number, app]

# Рекомендуемое время публикации (Asia/Almaty), отправляется SMM-щику вместе с пакетом.
slot_times: ["09:00", "19:30"]
