# Рубрикатор и недельная сетка: 2 публикации в день, 14 в неделю.
# source: rss — тема берётся из RSS по скорингу; brand — пост о продукте без внешнего источника.
# fallback: рубрика, которой заменить эту, если для неё нет материала (например, отчёты из Drive ещё не подключены).

rubrics:
  science:
    color: sky            # цвет метки рубрики на обложке
    title: Наука о соседстве
    source: rss
    format: carousel
    slides: 7
    brief: >
      Разбор одного свежего исследования о социальных связях, соседстве, одиночестве, сообществах,
      социальном здоровье или долголетии — как маленькая статья: обложка-заголовок, лид (lead),
      анализ (почему так и что мы обычно думаем), история исследования с деталями (кто, где, сколько людей
      и лет, что удивило), вывод для жизни во дворе (statement), маленький шаг на неделю (steps), призыв.
  practice:
    color: green            # цвет метки рубрики на обложке
    title: Долголетие на практике
    source: rss
    prefer_kind: popular
    format: carousel
    slides: 7
    brief: >
      Практическая инструкция: конкретные шаги или привычки для активного долголетия,
      которые легче делать вместе с соседями. Опора на источник, акцент на «что сделать на этой неделе».
  number:
    color: orange            # цвет метки рубрики на обложке
    title: Цифра дня
    source: rss
    format: reels           # если ElevenLabs не подключён — карусель из 6 слайдов
    slides: 6
    brief: >
      Одна сильная цифра из исследования крупно на слайде, затем контекст (кто, где, сколько людей),
      что из этого следует для нас и вопрос аудитории. Только если в источнике есть настоящая цифра.
  courtyard:
    color: orange            # цвет метки рубрики на обложке
    title: Жизнь дворов
    source: drive           # этап 2: отчёты о соседских активностях из Google Drive
    fallback: science
    format: carousel
    slides: 12
    brief: Фото-дайджест по отчётам о проведённых соседских активностях BIG Life в разных городах, с реальными фото.
  reel:
    color: orange            # цвет метки рубрики на обложке
    title: Reels
    source: rss
    format: reels           # шаблоны по очереди: миф/правда, цифра, эксперимент, 3 вещи (writer.REEL_FORMATS)
    slides: 6               # если ElevenLabs не подключён — карусель
    brief: >
      Пробный Reels для людей, которые BIG Life ещё не знают: одно исследование о связях между людьми,
      соседстве, одиночестве или долголетии в классической структуре хук → ставка и петля → три бита
      с повторным крючком → развязка → «отправь соседу». Цель — досмотр и репосты.
  question:
    color: periwinkle            # цвет метки рубрики на обложке
    title: Вопрос недели
    source: rss
    format: carousel
    slides: 6
    brief: >
      Интерактив по структуре статьи: обложка с интригой, лид (lead) — в чём парадокс или вопрос,
      анализ — что мы обычно думаем и что показало исследование (кто, где, сколько людей, как проверяли),
      почему так происходит и что это значит для жизни во дворе, затем вопрос аудитории (question) с 2–3
      вариантами ответа из жизни и финал с призывом ответить в комментариях. Мысль развёрнута до конца,
      а не обрублена до одной фразы.
  weekend:
    color: green            # цвет метки рубрики на обложке
    title: Идеи на выходные
    source: ideas
    format: carousel
    slides: 8
    brief: >
      Пятничная подборка: 5–6 конкретных идей добрососедства на ближайшие выходные и следующую неделю.
      Каждая идея — что сделать, с кем и сколько это займёт; лёгкие, бесплатные или почти бесплатные,
      по сезону и погоде, с учётом праздников из календаря. Часть идей — для выходных, часть — на будни.
      Можно опираться на то, что уже делали соседи во дворах BIG Life на этой неделе, и на свежую
      практичную науку о связях (если дана). Финал — позвать сохранить и выбрать одну идею.
  app:
    color: sky            # цвет метки рубрики на обложке
    title: BIG App
    source: brand
    format: carousel
    slides: 5
    brief: >
      Польза BIG App для жителей: лента активностей двора, календарь «Картина дня», чаты соседей,
      роль «Драйвера дома». Через жизненную ситуацию, без рекламного тона.

# Недельная сетка (1 = понедельник). Три слота: утренняя и вечерняя карусели, Reels вечером.
schedule:
  1: [science, practice, reel]
  2: [science, question, reel]
  3: [science, courtyard, reel]
  4: [science, practice, reel]
  5: [weekend, science, reel]   # пятница: утром идеи на выходные
  6: [courtyard, question, reel]
  7: [app, practice, reel]

# Рекомендуемое время публикации (Asia/Almaty), отправляется SMM-щику вместе с пакетом.
slot_times: ["09:00", "19:30", "20:30"]   # третий слот — Reels каждый вечер
